name: Build data engineer PDF

on:
  push:
    paths:
      - 'data-engineer/**'
      - '!data-engineer/data-engineer.pdf'
      - '.github/workflows/data-engineer-pdf.yml'
      - '.github/pdf-header.tex'

permissions:
  contents: write

concurrency:
  group: data-engineer-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pdf:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pandoc texlive-xetex texlive-fonts-recommended texlive-latex-extra fonts-dejavu

      - name: Combine guides in README order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path('data-engineer')
          readme = root / 'README.md'
          links = re.findall(r'\[[^\]]+\]\(([^)]+\.md)\)', readme.read_text(encoding='utf-8'))
          files = list(dict.fromkeys([readme, *(root / link for link in links)]))
          assert set(files) == set(root.rglob('*.md')), 'README must link every Markdown guide, with no missing or outside files'
          subprocess.run([
              'pandoc', *map(str, files), '--from=gfm', '--toc', '--toc-depth=2',
              '--pdf-engine=xelatex', '--no-highlight',
              '-V', 'mainfont=DejaVu Sans', '-V', 'monofont=DejaVu Sans Mono',
              '-V', 'geometry:margin=20mm', '-V', 'fontsize=10pt',
              '--include-in-header=.github/pdf-header.tex',
              '--output=data-engineer/data-engineer.pdf',
          ], check=True)
          PY

      - name: Save PDF to the branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data-engineer/data-engineer.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: update data engineer PDF"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
